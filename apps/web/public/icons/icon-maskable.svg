<!-- Versão maskable: zona segura é 80% central. Texto/forma fica menor pra
     não ser cortado quando o launcher aplicar shape (círculo, squircle, etc.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1d1a14"/>
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="240" font-weight="400" fill="#f6f1e8">S</text>
</svg>
