<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <title>Savit · Protótipo (Paper)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(29,26,20,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(29,26,20,0.22); }
    ::-webkit-scrollbar-track { background: transparent; }

    :root {
      /* Paper tokens (default accent: citrus) */
      --bg: #f6f1e8;
      --surface: #fdfaf3;
      --surface-2: #f0e9da;
      --ink: #1d1a14;
      --ink-2: #5b5448;
      --ink-3: #8a8270;
      --hair: rgba(29,26,20,0.10);
      --hair-strong: rgba(29,26,20,0.18);
      --accent: #c0563a;
      --accent-soft: rgba(192,86,58,0.10);
      --green: #3a8a6a;
      --amber: #c9931f;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Geist", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --shadow-sm: 0 1px 0 rgba(29,26,20,0.04);
      --shadow-md: 0 1px 0 rgba(29,26,20,0.04), 0 12px 24px -16px rgba(29,26,20,0.18);
      --shadow-lg: 0 24px 60px -12px rgba(29,26,20,0.22);
    }

    /* Density */
    [data-density="compact"] {
      --row-pad: 10px 14px;
      --card-pad: 12px;
      --gap: 8px;
    }
    [data-density="comfortable"] {
      --row-pad: 14px 16px;
      --card-pad: 16px;
      --gap: 12px;
    }

    /* Accent variants (Paper) */
    [data-accent="citrus"]  { --accent: #c0563a; --accent-soft: rgba(192,86,58,0.10); }
    [data-accent="terra"]   { --accent: #9b4a2e; --accent-soft: rgba(155,74,46,0.10); }
    [data-accent="amber"]   { --accent: #c9931f; --accent-soft: rgba(201,147,31,0.10); }
    [data-accent="mint"]    { --accent: #3a8a6a; --accent-soft: rgba(58,138,106,0.10); }
    [data-accent="purple"]  { --accent: #7a5cc7; --accent-soft: rgba(122,92,199,0.10); }
    [data-accent="blue"]    { --accent: #2f5cd6; --accent-soft: rgba(47,92,214,0.10); }

    html, body {
      background: #e8e2d4;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .mono { font-family: var(--mono); }
    .serif { font-family: var(--serif); }

    /* App shell */
    .app {
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      display: grid;
      grid-template-columns: 224px 1fr 380px;
      grid-template-rows: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* When detail panel is hidden */
    .app[data-detail="closed"] {
      grid-template-columns: 224px 1fr 0;
    }
    .app[data-detail="closed"] .detail-panel {
      transform: translateX(100%);
    }

    /* Smooth panel slide */
    .detail-panel {
      transition: transform 320ms cubic-bezier(0.34, 1.2, 0.64, 1);
      will-change: transform;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: background 120ms, transform 120ms;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #2d2820; }
    .btn-ghost { background: transparent; color: var(--ink-2); }
    .btn-ghost:hover { background: rgba(29,26,20,0.05); color: var(--ink); }
    .btn-soft { background: var(--accent-soft); color: var(--accent); }
    .btn-soft:hover { background: rgba(192,86,58,0.16); }
    .btn-danger { background: rgba(192,86,58,0.10); color: #c0563a; }
    .btn-icon {
      width: 32px; height: 32px; padding: 0; border-radius: 8px;
      color: var(--ink-2);
    }
    .btn-icon:hover { background: rgba(29,26,20,0.05); color: var(--ink); }

    /* Inputs */
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--hair);
      border-radius: 10px;
      background: var(--surface);
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color 120ms, background 120ms;
    }
    .input:focus { border-color: var(--ink-2); background: #fff; }
    .input::placeholder { color: var(--ink-3); }

    /* Hairline divider */
    .hairline { height: 1px; background: var(--hair); }
    .vhairline { width: 1px; align-self: stretch; background: var(--hair); }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10px;
      font-family: var(--mono);
      letter-spacing: 0.06em;
      background: rgba(29,26,20,0.06);
      color: var(--ink-2);
    }

    .swatch {
      width: 8px; height: 8px; border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Spring checkbox */
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 280ms cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Strikethrough animation */
    @keyframes draw-strike {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Card hover */
    .card-row {
      transition: background 120ms;
      cursor: pointer;
    }
    .card-row:hover { background: rgba(29,26,20,0.025); }
    .card-row[data-selected="true"] {
      background: var(--accent-soft);
    }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex; flex-direction: column-reverse; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: #fdfaf3;
      padding: 10px 14px 10px 16px;
      border-radius: 12px;
      box-shadow: 0 24px 60px -12px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 12px;
      font-size: 13px;
      pointer-events: auto;
      min-width: 280px;
      animation: toast-in 280ms cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .toast[data-leaving="true"] {
      animation: toast-out 220ms cubic-bezier(0.4, 0, 1, 0.6) forwards;
    }
    .toast-undo {
      color: var(--accent);
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      margin-left: auto;
    }
    .toast-undo:hover { background: rgba(255,255,255,0.08); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(8px); }
    }

    /* Search overlay */
    .search-overlay {
      position: fixed;
      inset: 0;
      background: rgba(29,26,20,0.30);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 300;
      display: flex;
      justify-content: center;
      padding-top: 14vh;
      animation: fade-in 180ms ease-out;
    }
    .search-modal {
      width: 640px;
      max-width: 92vw;
      background: var(--surface);
      border: 1px solid var(--hair);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      max-height: 70vh;
      display: flex; flex-direction: column;
      animation: search-pop 280ms cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes search-pop {
      from { opacity: 0; transform: translateY(-12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Modal (edit) */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(29,26,20,0.30);
      backdrop-filter: blur(4px);
      z-index: 250;
      display: flex; align-items: center; justify-content: center;
      animation: fade-in 180ms ease-out;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--hair);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      width: 520px;
      max-width: 92vw;
      max-height: 86vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: search-pop 280ms cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    /* Tweaks panel */
    .tweaks-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 400;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--hair);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      padding: 14px;
      animation: search-pop 240ms cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    .tweaks-toggle {
      position: fixed;
      top: 14px; right: 14px;
      z-index: 80;
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--hair);
      color: var(--ink-2);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: transform 120ms;
    }
    .tweaks-toggle:hover { color: var(--ink); transform: rotate(45deg); }

    /* Color picker swatches */
    .picker-swatch {
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 160ms cubic-bezier(0.34, 1.5, 0.64, 1), box-shadow 160ms;
      position: relative;
    }
    .picker-swatch:hover { transform: scale(1.08); }
    .picker-swatch[data-selected="true"] {
      transform: scale(1.12);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink);
    }

    /* Composer chip animation */
    @keyframes chip-in {
      from { opacity: 0; transform: translateY(4px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .chip-in { animation: chip-in 220ms cubic-bezier(0.34, 1.5, 0.64, 1); }

    /* Section enter */
    @keyframes section-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .section-in { animation: section-in 260ms cubic-bezier(0.34, 1.2, 0.64, 1); }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      color: var(--ink-3);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="parser.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="sidebar.jsx"></script>
  <script type="text/babel" src="composer.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="search.jsx"></script>
  <script type="text/babel" src="edit-modal.jsx"></script>
  <script type="text/babel" src="detail-panel.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
  <script type="text/babel" src="toast.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
