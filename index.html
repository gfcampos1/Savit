<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075E54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Salve suas ideias como mensagens para você mesmo">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Savit - Suas Ideias</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">Savit</h1>
            </div>
            <div class="header-right">
                <button class="header-btn" id="searchBtn" title="Buscar">
                    <i class="fas fa-search"></i>
                </button>
                <button class="header-btn" id="categoriesBtn" title="Categorias">
                    <i class="fas fa-folder"></i>
                </button>
                <button class="header-btn" id="menuBtn" title="Menu">
                    <i class="fas fa-ellipsis-vertical"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar (Hidden by default) -->
        <div class="search-bar" id="searchBar">
            <div class="search-input-wrapper">
                <i class="fas fa-arrow-left" id="closeSearchBtn"></i>
                <input type="text" id="searchInput" placeholder="Buscar mensagens...">
                <i class="fas fa-times" id="clearSearchBtn"></i>
            </div>
            <div class="search-filters">
                <select id="searchCategoryFilter">
                    <option value="">Todas categorias</option>
                </select>
                <input type="date" id="searchDateFilter" placeholder="Data">
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Messages Feed -->
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-lightbulb"></i>
                    <h2>Suas ideias começam aqui</h2>
                    <p>Digite algo abaixo para salvar sua primeira ideia</p>
                </div>
            </div>
        </main>

        <!-- Message Input -->
        <div class="input-container">
            <div class="input-options" id="inputOptions">
                <button class="option-btn" id="addCategoryBtn" title="Adicionar categoria">
                    <i class="fas fa-tag"></i>
                </button>
                <button class="option-btn" id="addTaskBtn" title="Criar tarefa">
                    <i class="fas fa-check-square"></i>
                </button>
            </div>
            <div class="input-wrapper">
                <div class="selected-category" id="selectedCategory" style="display: none;">
                    <span class="category-badge" id="categoryBadge"></span>
                    <i class="fas fa-times" id="removeCategoryBtn"></i>
                </div>
                <div class="task-options" id="taskOptions" style="display: none;">
                    <div class="task-header">
                        <i class="fas fa-check-square"></i>
                        <span>Tarefa</span>
                        <i class="fas fa-times" id="removeTaskBtn"></i>
                    </div>
                    <div class="task-datetime">
                        <input type="date" id="taskDate">
                        <input type="time" id="taskTime">
                    </div>
                </div>
                <textarea id="messageInput" placeholder="Digite sua ideia..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Categories Panel (Slide from right) -->
        <div class="side-panel" id="categoriesPanel">
            <div class="panel-header">
                <button class="back-btn" id="closeCategoriesBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2>Categorias</h2>
                <button class="add-btn" id="newCategoryBtn">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="panel-content">
                <div class="categories-list" id="categoriesList">
                    <!-- Categories will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Category Messages Panel -->
        <div class="side-panel" id="categoryMessagesPanel">
            <div class="panel-header">
                <button class="back-btn" id="closeCategoryMessagesBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h2 id="categoryMessagesTitle">Categoria</h2>
            </div>
            <div class="panel-content">
                <div class="messages-container" id="categoryMessagesContainer">
                    <!-- Category messages will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Modals -->
        <!-- Category Selector Modal -->
        <div class="modal" id="categorySelectorModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Selecionar Categoria</h3>
                    <button class="close-modal" id="closeCategorySelectorModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="category-selector-list" id="categorySelectorList">
                        <!-- Categories will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- New/Edit Category Modal -->
        <div class="modal" id="categoryModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="categoryModalTitle">Nova Categoria</h3>
                    <button class="close-modal" id="closeCategoryModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="categoryName">Nome</label>
                        <input type="text" id="categoryName" placeholder="Ex: Trabalho, Pessoal...">
                    </div>
                    <div class="form-group">
                        <label>Cor</label>
                        <div class="color-picker" id="colorPicker">
                            <div class="color-option" data-color="#25D366" style="background: #25D366;"></div>
                            <div class="color-option" data-color="#128C7E" style="background: #128C7E;"></div>
                            <div class="color-option" data-color="#075E54" style="background: #075E54;"></div>
                            <div class="color-option" data-color="#34B7F1" style="background: #34B7F1;"></div>
                            <div class="color-option" data-color="#9C27B0" style="background: #9C27B0;"></div>
                            <div class="color-option" data-color="#E91E63" style="background: #E91E63;"></div>
                            <div class="color-option" data-color="#FF5722" style="background: #FF5722;"></div>
                            <div class="color-option" data-color="#FF9800" style="background: #FF9800;"></div>
                            <div class="color-option" data-color="#FFC107" style="background: #FFC107;"></div>
                            <div class="color-option" data-color="#4CAF50" style="background: #4CAF50;"></div>
                            <div class="color-option" data-color="#607D8B" style="background: #607D8B;"></div>
                            <div class="color-option" data-color="#795548" style="background: #795548;"></div>
                        </div>
                        <input type="color" id="customColor" class="custom-color-input">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelCategoryBtn">Cancelar</button>
                    <button class="btn btn-primary" id="saveCategoryBtn">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Edit Message Modal -->
        <div class="modal" id="editMessageModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Editar Mensagem</h3>
                    <button class="close-modal" id="closeEditMessageModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="editMessageText">Mensagem</label>
                        <textarea id="editMessageText" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editMessageCategory">Categoria</label>
                        <select id="editMessageCategory">
                            <option value="">Sem categoria</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="editMessageIsTask">
                            <span>É uma tarefa</span>
                        </label>
                    </div>
                    <div class="form-group task-fields" id="editTaskFields" style="display: none;">
                        <label>Data e hora da tarefa</label>
                        <div class="task-datetime">
                            <input type="date" id="editTaskDate">
                            <input type="time" id="editTaskTime">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger" id="deleteMessageBtn">
                        <i class="fas fa-trash"></i> Excluir
                    </button>
                    <button class="btn btn-primary" id="saveEditMessageBtn">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Context Menu -->
        <div class="context-menu" id="contextMenu">
            <div class="context-menu-item" data-action="edit">
                <i class="fas fa-edit"></i> Editar
            </div>
            <div class="context-menu-item" data-action="copy">
                <i class="fas fa-copy"></i> Copiar
            </div>
            <div class="context-menu-item" data-action="delete">
                <i class="fas fa-trash"></i> Excluir
            </div>
        </div>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item" id="exportDataBtn">
                <i class="fas fa-download"></i> Exportar dados
            </div>
            <div class="dropdown-item" id="importDataBtn">
                <i class="fas fa-upload"></i> Importar dados
            </div>
            <div class="dropdown-item" id="clearAllBtn">
                <i class="fas fa-trash-alt"></i> Limpar tudo
            </div>
        </div>

        <!-- Hidden file input for import -->
        <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>

    <script src="js/app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('SW registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
