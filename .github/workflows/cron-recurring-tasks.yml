name: Cron - Recurring Tasks

# Diariamente às 04:00 UTC (01:00 BRT). Pinga o endpoint da API que
# instancia tarefas recorrentes vencidas no backlog do Kanban.
#
# Setup único:
#   gh secret set CRON_SECRET --body "<valor de Railway → Savit → CRON_SECRET>"
# (ou via GitHub UI: Settings → Secrets and variables → Actions → New)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # permite disparo manual via UI/CLI

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/jobs/recurring-tasks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret não configurado no repositório"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://savit-production.up.railway.app/api/jobs/recurring-tasks)
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -1)
          echo "status: $status"
          echo "body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::job retornou $status"
            exit 1
          fi
