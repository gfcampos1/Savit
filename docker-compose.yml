services:
  postgres:
    image: postgres:16-alpine
    container_name: savit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: savit
      POSTGRES_PASSWORD: savit
      POSTGRES_DB: savit
    ports:
      - "5433:5432"
    volumes:
      - savit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savit -d savit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  savit-pgdata:
